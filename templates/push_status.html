<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>انتشار نهایی</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .container { text-align: center; background: white; padding: 2em 4em; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 500px; }
        h1 { color: #28a745; }
        p { color: #6c757d; }
        .form-group { margin-top: 2em; }
        label { font-weight: bold; display: block; margin-bottom: 0.5em; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
            direction: ltr;
            text-align: left;
        }
        button { font-size: 1.1em; padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer; transition: all 0.2s ease; background-color: #dc3545; color: white; margin-top: 1em; width: 100%; }
        button:hover { background-color: #c82333; }
        button:disabled { background-color: #6c757d; cursor: not-allowed; }
        #status-area { margin-top: 2em; padding: 1em; background-color: #e9ecef; border-radius: 5px; white-space: pre-wrap; font-family: monospace; text-align: left; direction: ltr; min-height: 50px; }
        a { margin-top: 2em; display: inline-block; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ کامیت موفق!</h1>
        <p>خبر «{{ title }}» با موفقیت در ریپازیتوری محلی ثبت شد.</p>
        <p>برای انتشار نهایی، لطفاً توکن دسترسی شخصی گیت‌هاب (PAT) خود را وارد کرده و روی دکمه Push کلیک کنید.</p>

        <div class="form-group">
            <label for="github-token">توکن دسترسی شخصی گیت‌هاب (PAT)</label>
            <input type="password" id="github-token" placeholder="ghp_...">
            <button id="push-btn">Push نهایی به GitHub</button>
        </div>

        <div id="status-area">منتظر دستور شما...</div>
        <a href="/">بازگشت به صفحه اصلی</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const pushBtn = document.getElementById('push-btn');
            const tokenInput = document.getElementById('github-token');
            const statusArea = document.getElementById('status-area');

            pushBtn.addEventListener('click', async function() {
                const token = tokenInput.value;
                if (!token) {
                    statusArea.textContent = 'لطفاً توکن را وارد کنید.';
                    statusArea.style.color = 'red';
                    return;
                }

                pushBtn.disabled = true;
                pushBtn.textContent = 'در حال Push...';
                statusArea.textContent = 'در حال ارسال تغییرات به GitHub...';

                try {
                    const response = await fetch('/push-to-github', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token })
                    });
                    const data = await response.json();

                    statusArea.textContent = data.message;
                    if (data.success) {
                        statusArea.style.color = 'green';
                        pushBtn.textContent = '✅ با موفقیت انجام شد';
                    } else {
                        statusArea.style.color = 'red';
                        pushBtn.disabled = false;
                        pushBtn.textContent = 'Push نهایی به GitHub';
                    }
                } catch (error) {
                    statusArea.textContent = 'خطای شبکه در ارتباط با سرور.';
                    statusArea.style.color = 'red';
                    pushBtn.disabled = false;
                    pushBtn.textContent = 'Push نهایی به GitHub';
                }
            });
        });
    </script>
</body>
</html>
